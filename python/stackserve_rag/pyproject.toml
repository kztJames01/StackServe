[project]
name = "stackserve-rag"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
stackserve-rag-worker = "stackserve_rag.worker:main"

[project.optional-dependencies]
vector = [
    "numpy==2.3.4",
    "onnxruntime==1.23.2",
    "tokenizers==0.22.1",
]

[dependency-groups]
dev = ["jsonschema==4.25.1", "pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
