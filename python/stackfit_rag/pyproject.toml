[project]
name = "stackfit-rag"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
stackfit-rag-worker = "stackfit_rag.worker:main"

[dependency-groups]
dev = ["jsonschema==4.25.1", "pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
