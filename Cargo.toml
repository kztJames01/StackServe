[workspace]
resolver = "2"
members = []
# Crates will be added as crates/stackfit-core and crates/stackfit-mcp are created.
default-members = []

[workspace.package]
name = "stackfit-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kaung Zaw Thant <kztJames01@users.noreply.github.com>"]
repository = "https://github.com/kztJames01/stackfit-mcp"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1", features = ["serde"] }
