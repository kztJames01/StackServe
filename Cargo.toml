[workspace]
resolver = "2"
members = ["crates/stackserve-core", "crates/stackserve-mcp"]
default-members = ["crates/stackserve-core", "crates/stackserve-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kaung Zaw Thant <kztJames01@users.noreply.github.com>"]
repository = "https://github.com/kztJames01/stackserve-mcp"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1", features = ["serde"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
sha2 = "0.11"
