name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features --workspace

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --locked
        working-directory: python/stackfit_rag
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
        working-directory: python/stackfit_rag
      - name: validate curated corpus
        run: uv run python -m stackfit_rag.maintenance validate
        working-directory: python/stackfit_rag
      - name: pytest
        run: uv run pytest
        working-directory: python/stackfit_rag

  contract:
    name: shared protocol contract
    runs-on: ubuntu-latest
    env:
      STACKFIT_PROFILE_BIN: ${{ github.workspace }}/target/debug/stackfit-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: astral-sh/setup-uv@v5
      - run: cargo test -p stackfit-core protocol::tests::shared_fixture --locked
      - run: cargo build -p stackfit-mcp --locked
      - run: uv sync --locked
        working-directory: python/stackfit_rag
      - run: uv run pytest tests/test_protocol.py tests/test_profile_schema.py tests/test_mcp_search.py
        working-directory: python/stackfit_rag

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
