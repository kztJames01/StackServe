name: container

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - "crates/**"
      - "python/**"
      - "catalog/**"
      - "corpus/**"
      - "recipes/**"
      - "schemas/**"
      - "fixtures/**"
      - scripts/container_smoke.py
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: stackserve-mcp:ci

jobs:
  image:
    name: build and smoke (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify Dockerfile casing
        run: |
          set -euo pipefail
          test -f Dockerfile
          if git ls-files | grep -qx 'dockerfile'; then
            echo "tracked lowercase dockerfile would shadow Dockerfile on case-sensitive checkouts" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: build image
        run: docker buildx build --platform linux/amd64 -t "$IMAGE" --load .
      - name: smoke over stdio without network
        run: python3 scripts/container_smoke.py --image "$IMAGE" --platform linux/amd64 --network none
      - name: record image id and size
        run: |
          docker image inspect "$IMAGE" --format 'id={{.Id}}'
          docker image inspect "$IMAGE" --format 'size={{.Size}}'
