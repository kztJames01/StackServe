services:
  - type: web
    name: stackserve-mcp
    runtime: image
    plan: free
    image:
      url: ghcr.io/kztjames01/stackserve-mcp:0.1.0
    dockerCommand: serve-http --allow-unauthenticated
    healthCheckPath: /healthz
    envVars:
      - key: STACKSERVE_HTTP_RATE_LIMIT_PER_MIN
        value: "60"
      - key: STACKSERVE_WORKER_STARTUP_TIMEOUT_SECS
        value: "60"
